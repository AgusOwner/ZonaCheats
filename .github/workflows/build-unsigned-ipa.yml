name: Build unsigned IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target ZonaCheatsX \
            -sdk iphoneos \
            -configuration Release \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            CONFIGURATION_BUILD_DIR=$PWD/build \
            clean build

      - name: Package IPA
        run: |
          APP=$(ls -d build/*.app | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ZonaCheatsX-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonaCheatsX-unsigned-ipa
          path: ZonaCheatsX-unsigned.ipa